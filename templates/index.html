<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE SOLVER — Mysterious Math Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<header>
  <div class="wrap">
    <div class="logo">
      <span class="sigil">∎</span>
      <span class="logo-text">THE SOLVER</span>
    </div>
    <div class="tagline">Mathematics · Undefined</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-sigil">⧫</div>
    <h1>Every equation has an answer.</h1>
    <p>Submit your question. The engine will reveal the path step by step.</p>
    <div class="hero-divider">
      <span></span><span class="dot">◆</span><span></span>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="card-num">I</span>
      <span class="card-title">Choose Your Engine</span>
    </div>

    <div class="engines" id="engines">
      <button type="button" class="engine-btn active" data-engine="lightning">
        <span class="eng-icon">⚡</span>
        <span class="eng-name">Lightning</span>
        <span class="eng-sub">Fast · Groq</span>
      </button>
      <button type="button" class="engine-btn" data-engine="reasoning">
        <span class="eng-icon">🧠</span>
        <span class="eng-name">Reasoning</span>
        <span class="eng-sub">Deep logic · Groq</span>
      </button>
      <button type="button" class="engine-btn" data-engine="gemini">
        <span class="eng-icon">🌐</span>
        <span class="eng-name">Gemini</span>
        <span class="eng-sub">Google · OpenRouter</span>
      </button>
      <button type="button" class="engine-btn" data-engine="deepseek">
        <span class="eng-icon">🔷</span>
        <span class="eng-name">DeepSeek</span>
        <span class="eng-sub">Math specialist</span>
      </button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="card-num">II</span>
      <span class="card-title">Enter Your Equation</span>
    </div>

    <form id="solveForm">
      <div class="field">
        <label for="question">Type your problem</label>
        <textarea id="question" name="question" placeholder="e.g., 2x + 5 = 15"></textarea>

        <div class="math-kb">
          <div class="kb-tabs">
            <button type="button" class="kb-tab active" data-tab="basic">Basic</button>
            <button type="button" class="kb-tab" data-tab="power">Powers</button>
            <button type="button" class="kb-tab" data-tab="trig">Trigonometry</button>
            <button type="button" class="kb-tab" data-tab="calc">Calculus</button>
            <button type="button" class="kb-tab" data-tab="log">Logarithms</button>
          </div>

          <div class="kb-panel active" data-panel="basic">
            <button type="button" data-insert="+">+</button>
            <button type="button" data-insert="-">−</button>
            <button type="button" data-insert="*">×</button>
            <button type="button" data-insert="/">÷</button>
            <button type="button" data-insert="=">=</button>
            <button type="button" data-insert="(">(</button>
            <button type="button" data-insert=")">)</button>
            <button type="button" data-insert=".">.</button>
            <button type="button" data-insert=",">,</button>
            <button type="button" data-insert="^">^</button>
            <button type="button" data-insert="|">|</button>
            <button type="button" data-insert="%">%</button>
          </div>

          <div class="kb-panel" data-panel="power">
            <button type="button" data-insert="^2">x²</button>
            <button type="button" data-insert="^3">x³</button>
            <button type="button" data-insert="^n">xⁿ</button>
            <button type="button" data-insert="^(1/2)">√</button>
            <button type="button" data-insert="^(1/3)">∛</button>
            <button type="button" data-insert="10^">10^</button>
            <button type="button" data-insert="e^">e^</button>
            <button type="button" data-insert="[">[</button>
            <button type="button" data-insert="]">]</button>
            <button type="button" data-insert="{">{</button>
            <button type="button" data-insert="}">}</button>
            <button type="button" data-insert="!">!</button>
          </div>

          <div class="kb-panel" data-panel="trig">
            <button type="button" data-insert="sin(">sin</button>
            <button type="button" data-insert="cos(">cos</button>
            <button type="button" data-insert="tan(">tan</button>
            <button type="button" data-insert="cot(">cot</button>
            <button type="button" data-insert="sec(">sec</button>
            <button type="button" data-insert="csc(">csc</button>
            <button type="button" data-insert="arcsin(">sin⁻¹</button>
            <button type="button" data-insert="arccos(">cos⁻¹</button>
            <button type="button" data-insert="arctan(">tan⁻¹</button>
            <button type="button" data-insert="pi">π</button>
            <button type="button" data-insert="theta">θ</button>
            <button type="button" data-insert="deg">°</button>
          </div>

          <div class="kb-panel" data-panel="calc">
            <button type="button" data-insert="integral ">∫</button>
            <button type="button" data-insert="d/dx ">d/dx</button>
            <button type="button" data-insert="sum ">∑</button>
            <button type="button" data-insert="product ">∏</button>
            <button type="button" data-insert="lim ">lim</button>
            <button type="button" data-insert="infinity">∞</button>
            <button type="button" data-insert="Delta ">Δ</button>
            <button type="button" data-insert="partial ">∂</button>
            <button type="button" data-insert="-> ">→</button>
            <button type="button" data-insert="d^2/dx^2 ">d²/dx²</button>
            <button type="button" data-insert="int_0^1 ">∫₀¹</button>
            <button type="button" data-insert="sum_{n=1} ">∑n</button>
          </div>

          <div class="kb-panel" data-panel="log">
            <button type="button" data-insert="log(">log</button>
            <button type="button" data-insert="ln(">ln</button>
            <button type="button" data-insert="log2(">log₂</button>
            <button type="button" data-insert="log10(">log₁₀</button>
            <button type="button" data-insert="e">e</button>
            <button type="button" data-insert="exp(">exp</button>
            <button type="button" data-insert="abs(">|x|</button>
            <button type="button" data-insert="sqrt(">√</button>
            <button type="button" data-insert="pow(">pow</button>
            <button type="button" data-insert="(">(</button>
            <button type="button" data-insert=")">)</button>
            <button type="button" data-insert=",">,</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="imageInput">Or submit an image</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="imageInput" name="image" accept="image/*" hidden>
          <div class="upload-text">
            <span class="upload-icon">◇</span>
            <span class="upload-main">Click to select a photo</span>
            <span class="upload-hint">JPG · PNG · Max 20 MB</span>
          </div>
          <div class="preview" id="preview"></div>
        </div>
      </div>

      <button type="submit" class="solve-btn" id="solveBtn">
        <span class="btn-text">REVEAL THE ANSWER</span>
        <span class="btn-loader" hidden></span>
      </button>
    </form>
  </section>

  <section class="result" id="result" hidden>
    <div class="card-head">
      <span class="card-num">III</span>
      <span class="card-title">The Revelation</span>
      <button class="copy-btn" id="copyBtn" title="Copy">⧉</button>
    </div>
    <div class="result-body" id="resultBody"></div>
  </section>

  <section class="error" id="errorBox" hidden></section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-line"></div>
    <p>∎ Made by JMFakhri</p>
  </div>
</footer>

<script>
const form = document.getElementById('solveForm');
const questionInput = document.getElementById('question');
const imageInput = document.getElementById('imageInput');
const uploadArea = document.getElementById('uploadArea');
const preview = document.getElementById('preview');
const solveBtn = document.getElementById('solveBtn');
const btnText = solveBtn.querySelector('.btn-text');
const btnLoader = solveBtn.querySelector('.btn-loader');
const resultSection = document.getElementById('result');
const resultBody = document.getElementById('resultBody');
const errorBox = document.getElementById('errorBox');
const copyBtn = document.getElementById('copyBtn');

let selectedEngine = 'lightning';

/* ============ انتخاب موتور ============ */
document.querySelectorAll('.engine-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedEngine = btn.getAttribute('data-engine');
  });
});

/* ============ کیبورد ریاضی ============ */
document.querySelectorAll('.kb-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.kb-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.kb-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.kb-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

document.querySelectorAll('.math-kb [data-insert]').forEach(btn => {
  btn.addEventListener('click', () => {
    insertAtCursor(questionInput, btn.getAttribute('data-insert'));
  });
});

function insertAtCursor(textarea, text) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const value = textarea.value;
  textarea.value = value.substring(0, start) + text + value.substring(end);
  const newPos = start + text.length;
  textarea.selectionStart = textarea.selectionEnd = newPos;
  textarea.focus();
}

/* ============ آپلود عکس ============ */
uploadArea.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    preview.innerHTML = `<img src="${e.target.result}" alt="preview">`;
    preview.style.display = 'block';
    uploadArea.querySelector('.upload-text').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

/* ============ ارسال ============ */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  resultSection.hidden = true;

  const question = questionInput.value.trim();
  const hasImage = imageInput.files.length > 0;

  if (!question && !hasImage) {
    showError('Provide a question or an image.');
    return;
  }

  solveBtn.disabled = true;
  btnText.hidden = true;
  btnLoader.hidden = false;

  const formData = new FormData();
  if (question) formData.append('question', question);
  formData.append('engine', selectedEngine);
  if (hasImage) formData.append('image', imageInput.files[0]);

  try {
    const res = await fetch('/api/solve', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.ok) {
      resultBody.innerHTML = formatAnswer(data.answer);
      resultSection.hidden = false;
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(renderMath, 50);
    } else {
      let msg = '⚠ ' + (data.error || 'Something went wrong.');
      if (data.detail) msg += '\n\n' + data.detail;
      errorBox.textContent = msg;
      errorBox.style.whiteSpace = 'pre-wrap';
      errorBox.hidden = false;
      errorBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch (err) {
    showError('Network error: ' + err.message);
  } finally {
    solveBtn.disabled = false;
    btnText.hidden = false;
    btnLoader.hidden = true;
  }
});

function formatAnswer(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('resultBody'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.whiteSpace = 'pre-wrap';
  errorBox.hidden = false;
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(resultBody.innerText);
  copyBtn.textContent = '✓';
  setTimeout(() => copyBtn.textContent = '⧉', 1500);
});
</script>

</body>
</html>
