<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حل‌کننده ریاضی | Math Solver</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">🧮 حل‌کننده ریاضی</div>
    <div class="lang-hint">فارسی و English</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>هر سوال ریاضی داری، بپرس!</h1>
    <p>تایپ کن یا عکس مسئله رو آپلود کن. مرحله‌به‌مرحله برات حلش می‌کنم.</p>
  </section>

  <section class="card">
    <form id="solveForm">
      <div class="field">
        <label>سوالت رو بنویس:</label>
        <textarea id="question" name="question" placeholder="مثلاً: معادله x² + 5x + 6 = 0 رو حل کن."></textarea>

        <!-- ============ کیبورد ریاضی ============ -->
        <div class="math-kb" id="mathKb">
          <div class="kb-tabs">
            <button type="button" class="kb-tab active" data-tab="basic">پایه</button>
            <button type="button" class="kb-tab" data-tab="power">توان و رادیکال</button>
            <button type="button" class="kb-tab" data-tab="trig">مثلثات</button>
            <button type="button" class="kb-tab" data-tab="calc">دیفرانسیل</button>
            <button type="button" class="kb-tab" data-tab="log">لگاریتم</button>
          </div>

          <div class="kb-panel active" data-panel="basic">
            <button type="button" data-insert="+" title="جمع">+</button>
            <button type="button" data-insert="-" title="تفریق">−</button>
            <button type="button" data-insert="×" title="ضرب">×</button>
            <button type="button" data-insert="÷" title="تقسیم">÷</button>
            <button type="button" data-insert="=" title="مساوی">=</button>
            <button type="button" data-insert="(" title="پرانتز باز">(</button>
            <button type="button" data-insert=")" title="پرانتز بسته">)</button>
            <button type="button" data-insert="." title="ممیز">.</button>
            <button type="button" data-insert="," title="کاما">,</button>
            <button type="button" data-insert="≠" title="نامساوی">≠</button>
            <button type="button" data-insert="≤" title="کوچکتر یا مساوی">≤</button>
            <button type="button" data-insert="≥" title="بزرگتر یا مساوی">≥</button>
          </div>

          <div class="kb-panel" data-panel="power">
            <button type="button" data-insert="^2" title="توان دو">x²</button>
            <button type="button" data-insert="^3" title="توان سه">x³</button>
            <button type="button" data-insert="^" title="توان n">xⁿ</button>
            <button type="button" data-insert="√(" title="رادیکال">√</button>
            <button type="button" data-insert="∛(" title="رادیکال سوم">∛</button>
            <button type="button" data-insert="^(1/2)" title="جذر">^(1/2)</button>
            <button type="button" data-insert="^(1/3)" title="رادیکال سوم">^(1/3)</button>
            <button type="button" data-insert="10^" title="ده به توان">10^</button>
            <button type="button" data-insert="e^" title="e به توان">e^</button>
            <button type="button" data-insert="|" title="قدر مطلق">|</button>
            <button type="button" data-insert="[" title="براکت باز">[</button>
            <button type="button" data-insert="]" title="براکت بسته">]</button>
          </div>

          <div class="kb-panel" data-panel="trig">
            <button type="button" data-insert="sin(" title="سینوس">sin</button>
            <button type="button" data-insert="cos(" title="کسینوس">cos</button>
            <button type="button" data-insert="tan(" title="تانژانت">tan</button>
            <button type="button" data-insert="cot(" title="کتانژانت">cot</button>
            <button type="button" data-insert="sec(" title="سکانت">sec</button>
            <button type="button" data-insert="csc(" title="کسکانت">csc</button>
            <button type="button" data-insert="asin(" title="آرک‌سینوس">sin⁻¹</button>
            <button type="button" data-insert="acos(" title="آرک‌کسینوس">cos⁻¹</button>
            <button type="button" data-insert="atan(" title="آرک‌تانژانت">tan⁻¹</button>
            <button type="button" data-insert="π" title="پی">π</button>
            <button type="button" data-insert="θ" title="تتا">θ</button>
            <button type="button" data-insert="°" title="درجه">°</button>
          </div>

          <div class="kb-panel" data-panel="calc">
            <button type="button" data-insert="∫(" title="انتگرال">∫</button>
            <button type="button" data-insert="d/dx(" title="مشتق">d/dx</button>
            <button type="button" data-insert="∑(" title="سیگما">∑</button>
            <button type="button" data-insert="∏(" title="پی‌بزرگ">∏</button>
            <button type="button" data-insert="lim(" title="حد">lim</button>
            <button type="button" data-insert="∞" title="بی‌نهایت">∞</button>
            <button type="button" data-insert="Δ" title="دلتا">Δ</button>
            <button type="button" data-insert="∂" title="مشتق جزئی">∂</button>
            <button type="button" data-insert="→" title="میل به">→</button>
            <button type="button" data-insert="n→∞" title="n به بی‌نهایت">n→∞</button>
          </div>

          <div class="kb-panel" data-panel="log">
            <button type="button" data-insert="log(" title="لگاریتم">log</button>
            <button type="button" data-insert="ln(" title="لگاریتم طبیعی">ln</button>
            <button type="button" data-insert="log2(" title="لگاریتم پایه ۲">log₂</button>
            <button type="button" data-insert="log10(" title="لگاریتم پایه ۱۰">log₁₀</button>
            <button type="button" data-insert="e" title="عدد نپر">e</button>
            <button type="button" data-insert="/" title="کسر">/</button>
            <button type="button" data-insert="{" title="آکولاد باز">{</button>
            <button type="button" data-insert="}" title="آکولاد بسته">}</button>
            <button type="button" data-insert="%" title="درصد">%</button>
            <button type="button" data-insert="!" title="فاکتوریل">!</button>
          </div>
        </div>
        <!-- ============ پایان کیبورد ریاضی ============ -->
      </div>

      <div class="field">
        <label>یا عکس مسئله رو بفرست:</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="imageInput" name="image" accept="image/*" hidden>
          <div class="upload-text">
            <span class="upload-icon">📷</span>
            <span>برای انتخاب عکس کلیک کن</span>
            <span class="upload-hint">JPG, PNG - حداکثر ۲۰ مگابایت</span>
          </div>
          <div class="preview" id="preview"></div>
        </div>
      </div>

      <button type="submit" class="solve-btn" id="solveBtn">
        <span class="btn-text">حل کن</span>
        <span class="btn-loader" hidden></span>
      </button>
    </form>
  </section>

  <section class="result" id="result" hidden>
    <div class="result-head">
      <h2>پاسخ:</h2>
      <button class="copy-btn" id="copyBtn" title="کپی">📋</button>
    </div>
    <div class="result-body" id="resultBody"></div>
  </section>

  <section class="error" id="errorBox" hidden></section>
</main>

<footer>
  <p>ساخته شده با پایتون و Groq AI</p>
</footer>

<script>
const form = document.getElementById('solveForm');
const questionInput = document.getElementById('question');
const imageInput = document.getElementById('imageInput');
const uploadArea = document.getElementById('uploadArea');
const preview = document.getElementById('preview');
const solveBtn = document.getElementById('solveBtn');
const btnText = solveBtn.querySelector('.btn-text');
const btnLoader = solveBtn.querySelector('.btn-loader');
const resultSection = document.getElementById('result');
const resultBody = document.getElementById('resultBody');
const errorBox = document.getElementById('errorBox');
const copyBtn = document.getElementById('copyBtn');

/* ============ کیبورد ریاضی ============ */
document.querySelectorAll('.kb-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.kb-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.kb-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.kb-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

document.querySelectorAll('.math-kb [data-insert]').forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.getAttribute('data-insert');
    insertAtCursor(questionInput, text);
  });
});

function insertAtCursor(textarea, text) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const value = textarea.value;
  const newValue = value.substring(0, start) + text + value.substring(end);
  textarea.value = newValue;
  const newPos = start + text.length;
  textarea.selectionStart = textarea.selectionEnd = newPos;
  textarea.focus();
}

/* ============ آپلود عکس ============ */
uploadArea.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    preview.innerHTML = `<img src="${e.target.result}" alt="preview">`;
    preview.style.display = 'block';
    uploadArea.querySelector('.upload-text').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

/* ============ ارسال فرم ============ */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  resultSection.hidden = true;

  const question = questionInput.value.trim();
  const hasImage = imageInput.files.length > 0;

  if (!question && !hasImage) {
    showError('سوال یا عکس رو وارد کن.');
    return;
  }

  solveBtn.disabled = true;
  btnText.hidden = true;
  btnLoader.hidden = false;

  const formData = new FormData();
  if (question) formData.append('question', question);
  if (hasImage) formData.append('image', imageInput.files[0]);

  try {
    const res = await fetch('/api/solve', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.ok) {
      resultBody.innerHTML = formatAnswer(data.answer);
      resultSection.hidden = false;
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(renderMath, 50);
    } else {
      let msg = '⚠️ ' + (data.error || 'خطایی پیش اومد.');
      if (data.detail) msg += '\n\n🔍 جزئیات خطا:\n' + data.detail;
      if (data.trace) msg += '\n\n📋 متن کامل:\n' + data.trace;
      errorBox.textContent = msg;
      errorBox.style.whiteSpace = 'pre-wrap';
      errorBox.hidden = false;
      errorBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch (err) {
    showError('خطای شبکه: ' + err.message);
  } finally {
    solveBtn.disabled = false;
    btnText.hidden = false;
    btnLoader.hidden = true;
  }
});

function formatAnswer(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('resultBody'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.whiteSpace = 'pre-wrap';
  errorBox.hidden = false;
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(resultBody.innerText);
  copyBtn.textContent = '✅';
  setTimeout(() => copyBtn.textContent = '📋', 1500);
});
</script>

</body>
</html>
