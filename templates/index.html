const form = document.getElementById('solveForm');

const historyList = document.getElementById('historyList');
const clearInputBtn = document.getElementById('clearInputBtn');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');
const clearChatBtn = document.getElementById('clearChatBtn');

// ▼ جدید
const voiceBtn = document.getElementById('voiceBtn');
const feedbackRow = document.getElementById('feedbackRow');
// ▲ جدید

let selectedEngine = 'lightning';
let currentMode = 'solve';
let sessionId = localStorage.getItem('solver_session') || ('s_' + Math.random().toString(36).substring(2, 12));
localStorage.setItem('solver_session', sessionId);
let rateLimitTimer = null;

// ▼ جدید: برای بازخورد
let lastQuestion = '';
let lastAnswer = '';
let lastEngineUsed = '';
let lastSource = '';
let feedbackSent = false;
// ▲ جدید

(function typeHero() {
  const target = document.getElementById('heroTitle');
  const text = 'Every equation has an answer.';
  let i = 0;
  target.innerHTML = '';
  const cursor = '<span class="tw-cursor">▊</span>';
  function step() {
    if (i <= text.length) {
      target.innerHTML = text.substring(0, i) + cursor;
      i++;
      setTimeout(step, 55);
    }
  }
  step();
})();

fetch('/api/engines').then(r => r.json()).then(data => {
  data.engines.forEach(e => {
    const btn = document.querySelector(`.engine-btn[data-engine="${e.key}"]`);
    if (btn && !e.available) btn.disabled = true;
  });
}).catch(() => {});

document.querySelectorAll('.engine-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedEngine = btn.getAttribute('data-engine');
  });
});

document.querySelectorAll('.mode-tab[data-mode]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab[data-mode]').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.getAttribute('data-mode');
  });
});

clearChatBtn.addEventListener('click', async () => {
  await fetch('/api/clear_chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId})
  });
  clearChatBtn.textContent = '✓';
  setTimeout(() => clearChatBtn.textContent = '✕', 1200);
});

// ============ Keyboard ============
document.querySelectorAll('.kb-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.kb-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.kb-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.kb-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

document.querySelectorAll('.math-kb [data-insert]').forEach(btn => {
  btn.addEventListener('click', () => insertAtCursor(questionInput, btn.getAttribute('data-insert')));
});

document.querySelectorAll('.math-kb [data-action="backspace"]').forEach(btn => {
  btn.addEventListener('click', () => backspaceInInput(questionInput));
});

document.querySelectorAll('.math-kb [data-action="clear"]').forEach(btn => {
  btn.addEventListener('click', () => {
    questionInput.value = '';
    questionInput.style.height = '';
    autoResize();
    questionInput.focus();
  });
});

function insertAtCursor(textarea, text) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const v = textarea.value;
  textarea.value = v.substring(0, start) + text + v.substring(end);
  const p = start + text.length;
  textarea.selectionStart = textarea.selectionEnd = p;
  textarea.focus();
  autoResize();
}

function backspaceInInput(textarea) {
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const v = textarea.value;
  if (start === end && start > 0) {
    textarea.value = v.substring(0, start - 1) + v.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start - 1;
  } else if (start !== end) {
    textarea.value = v.substring(0, start) + v.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start;
  }
  textarea.focus();
  autoResize();
}

function autoResize() {
  questionInput.style.height = 'auto';
  questionInput.style.height = Math.min(questionInput.scrollHeight, 260) + 'px';
}
questionInput.addEventListener('input', autoResize);
autoResize();

clearInputBtn.addEventListener('click', () => {
  questionInput.value = '';
  questionInput.style.height = '';
  autoResize();
  questionInput.focus();
});

// ============ Voice Input ============
(function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    voiceBtn.style.display = 'none';
    return;
  }
  const recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  voiceBtn.addEventListener('click', () => {
    if (voiceBtn.classList.contains('listening')) {
      try { recognition.stop(); } catch(e) {}
      return;
    }
    try { recognition.start(); } catch(e) {}
  });

  recognition.onstart = () => {
    voiceBtn.classList.add('listening');
    voiceBtn.title = 'Listening...';
  };
  recognition.onend = () => {
    voiceBtn.classList.remove('listening');
    voiceBtn.title = 'Voice input';
  };
  recognition.onerror = () => {
    voiceBtn.classList.remove('listening');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    questionInput.value = (questionInput.value + ' ' + transcript).trim();
    autoResize();
    questionInput.focus();
  };
})();

// ============ Result Helpers ============
function setResultBody(text) {
  resultBody.textContent = text;
  setTimeout(renderMath, 50);
}

function setSourceBadge(source, engineUsedLabel) {
  if (!source) { sourceBadge.hidden = true; return; }
  if (source === 'calculator') {
    sourceBadge.textContent = '⚡ INSTANT';
    sourceBadge.className = 'source-badge src-calc';
  } else if (source === 'cache') {
    sourceBadge.textContent = '📦 CACHED';
    sourceBadge.className = 'source-badge src-cache';
  } else {
    const label = engineUsedLabel || 'AI';
    sourceBadge.textContent = '🧠 ' + label;
    sourceBadge.className = 'source-badge src-ai';
  }
  sourceBadge.hidden = false;
}

// ============ Feedback ============
function resetFeedback() {
  feedbackSent = false;
  feedbackRow.querySelectorAll('.feedback-btn').forEach(b => {
    b.classList.remove('sent', 'sent-good', 'sent-bad');
    b.disabled = false;
  });
}

document.querySelectorAll('.feedback-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (feedbackSent) return;
    const rating = btn.getAttribute('data-rating');
    feedbackSent = true;
    btn.disabled = true;

    document.querySelectorAll('.feedback-btn').forEach(b => b.disabled = true);

    if (rating === 'good') {
      btn.classList.add('sent', 'sent-good');
    } else {
      btn.classList.add('sent', 'sent-bad');
    }

    try {
      await fetch('/api/feedback', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          rating: rating,
          question: lastQuestion,
          answer: lastAnswer,
          engine_used: lastEngineUsed,
          source: lastSource
        })
      });
    } catch(e) {}
  });
});

// ============ Rate Limit ============
function startRateLimitCountdown(seconds) {
  if (rateLimitTimer) clearInterval(rateLimitTimer);
  let remaining = seconds;
  errorBox.innerHTML =
    '<div class="rl-box">' +
      '<div class="rl-icon">✋</div>' +
      '<div class="rl-title">Slow down, mathematician.</div>' +
      '<div class="rl-msg">You can ask again in <span id="rlCount">' + remaining + '</span> seconds.</div>' +
    '</div>';
  errorBox.hidden = false;
  errorBox.scrollIntoView({behavior: 'smooth', block: 'start'});
  rateLimitTimer = setInterval(() => {
    remaining--;
    const el = document.getElementById('rlCount');
    if (el) el.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(rateLimitTimer);
      rateLimitTimer = null;
      errorBox.hidden = true;
    }
  }, 1000);
}

// ============ History ============
function getHistory() {
  try { return JSON.parse(localStorage.getItem('solver_history') || '[]'); } catch { return []; }
}
function setHistory(h) {
  localStorage.setItem('solver_history', JSON.stringify(h.slice(0, 8)));
  renderHistory();
}
function addToHistory(q, a, engine, source, engineUsedLabel) {
  const h = getHistory();
  h.unshift({ q, a, engine, source, engineUsedLabel, t: Date.now() });
  setHistory(h);
}
function renderHistory() {
  const h = getHistory();
  if (h.length === 0) { historySection.hidden = true; return; }
  historySection.hidden = false;
  historyList.innerHTML = '';
  h.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item';
    const qLine = document.createElement('div');
    qLine.className = 'h-q';
    qLine.textContent = item.q;
    const metaLine = document.createElement('div');
    metaLine.className = 'h-meta';
    metaLine.textContent = item.engine + ' · ' + new Date(item.t).toLocaleString();
    el.appendChild(qLine);
    el.appendChild(metaLine);
    el.addEventListener('click', () => {
      questionInput.value = item.q;
      autoResize();
      setResultBody(item.a);
      setSourceBadge(item.source || 'ai', item.engineUsedLabel);
      lastQuestion = item.q;
      lastAnswer = item.a;
      lastSource = item.source || 'ai';
      lastEngineUsed = item.engine || '';
      resetFeedback();
      resultSection.hidden = false;
      tryPlotGraph(item.q);
      resultSection.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
    historyList.appendChild(el);
  });
}
clearHistoryBtn.addEventListener('click', () => {
  localStorage.removeItem('solver_history');
  renderHistory();
});
renderHistory();

shareBtn.addEventListener('click', async () => {
  const url = window.location.origin + '/?q=' + encodeURIComponent(questionInput.value);
  try {
    await navigator.clipboard.writeText(url);
    shareBtn.textContent = '✓';
    setTimeout(() => shareBtn.textContent = '↗', 1500);
  } catch {}
});

(function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q');
  if (q) {
    questionInput.value = q;
    autoResize();
    setTimeout(() => form.dispatchEvent(new Event('submit')), 400);
  }
})();

function tryPlotGraph(question) {
  const m = question.match(/^\s*(?:y|f\s*\(\s*x\s*\))\s*=\s*(.+)$/i);
  if (!m) { graphWrap.hidden = true; return; }
  const fn = m[1].trim();
  graphWrap.hidden = false;
  setTimeout(() => {
    try {
      document.getElementById('graph').innerHTML = '';
      functionPlot({
        target: '#graph',
        width: Math.min(700, document.querySelector('.result').clientWidth - 40),
        height: 300,
        grid: true,
        xAxis: { domain: [-10, 10] },
        yAxis: { domain: [-10, 10] },
        data: [{ fn: fn, color: '#ffffff' }]
      });
    } catch (e) { graphWrap.hidden = true; }
  }, 80);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  resultSection.hidden = true;
  graphWrap.hidden = true;
  if (rateLimitTimer) { clearInterval(rateLimitTimer); rateLimitTimer = null; }

  const question = questionInput.value.trim();
  if (!question) { showError('Type your problem first.'); return; }

  solveBtn.disabled = true;
  btnText.textContent = 'CALCULATING';
  let dots = 0;
  const dotsTimer = setInterval(() => {
    dots = (dots + 1) % 4;
    if (btnText.textContent.indexOf('WAKING') === -1) {
      btnText.textContent = 'CALCULATING' + '.'.repeat(dots);
    }
  }, 400);
  btnLoader.hidden = false;

  const wakeTimer = setTimeout(() => {
    btnText.textContent = 'WAKING UP ENGINE';
  }, 8000);

  const fd = new FormData();
  fd.append('question', question);
  fd.append('engine', selectedEngine);
  fd.append('mode', currentMode);
  fd.append('session_id', sessionId);

  try {
    const res = await fetch('/api/solve', { method: 'POST', body: fd });
    const data = await res.json();

    if (res.status === 429 && data.rate_limited) {
      startRateLimitCountdown(data.retry_after || 60);
      return;
    }

    if (data.ok) {
      setResultBody(data.answer);
      setSourceBadge(data.source, data.engine_label);
      // ذخیره برای بازخورد
      lastQuestion = question;
      lastAnswer = data.answer;
      lastSource = data.source || 'ai';
      lastEngineUsed = data.engine_used || '';
      resetFeedback();
      resultSection.hidden = false;
      resultSection.scrollIntoView({behavior: 'smooth', block: 'start'});
      tryPlotGraph(question);
      if (currentMode === 'solve') {
        addToHistory(question, data.answer, data.engine_used || selectedEngine, data.source, data.engine_label);
      }
    } else {
      showError((data.error || 'Error') + (data.detail ? ' — ' + data.detail : ''));
    }
  } catch (err) {
    showError('Network error: ' + err.message);
  } finally {
    clearTimeout(wakeTimer);
    clearInterval(dotsTimer);
    solveBtn.disabled = false;
    btnText.textContent = 'REVEAL THE ANSWER';
    btnLoader.hidden = true;
  }
});

function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('resultBody'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false,
      trust: false
    });
  }
}

function showError(msg) {
  errorBox.textContent = '⚠ ' + msg;
  errorBox.style.whiteSpace = 'pre-wrap';
  errorBox.hidden = false;
  errorBox.scrollIntoView({behavior: 'smooth', block: 'start'});
}

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(resultBody.innerText);
  copyBtn.textContent = '✓';
  setTimeout(() => copyBtn.textContent = '⧉', 1500);
});
</script>
